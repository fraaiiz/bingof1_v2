services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: projet_dwwm_app
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      APP_URL: ${APP_URL}

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html

    depends_on:
      - db

  db:
    image: mariadb:11
    container_name: projet_dwwm_db
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: projet_dwwm_phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: db
      PMA_PORT: 3306

    ports:
      - "127.0.0.1:8081:80"

    depends_on:
      - db

volumes:
  mariadb_data: